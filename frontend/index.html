<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Dental — AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 420px; background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #1F4E79; color: white; padding: 20px; text-align: center; }
        .header h2 { font-size: 18px; }
        .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
        .messages { height: 420px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .user { align-self: flex-end; background: #1F4E79; color: white; border-bottom-right-radius: 4px; }
        .agent { align-self: flex-start; background: #f0f4f8; color: #1a1a1a; border-bottom-left-radius: 4px; }
        .typing { align-self: flex-start; background: #f0f4f8; padding: 10px 14px; border-radius: 12px; font-size: 13px; color: #888; }
        .intent-tag { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; }
        .input-area { padding: 16px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; }
        input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #1F4E79; }
        button { padding: 10px 18px; background: #1F4E79; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button:hover { background: #2E75B6; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .status { text-align: center; font-size: 12px; color: #6b7280; padding: 8px; }
        .status.connected { color: #16a34a; }
        .status.disconnected { color: #dc2626; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>City Dental Clinic</h2>
        <p>AI Assistant — Available 24/7</p>
    </div>
    <div id="status" class="status disconnected">Connecting...</div>
    <div id="messages" class="messages"></div>
    <div class="input-area">
        <input id="input" type="text" placeholder="Ask me anything..." disabled />
        <button id="send" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    const sessionId = crypto.randomUUID();
    const ws = new WebSocket(`ws://localhost:8000/ws/${sessionId}`);
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");

    ws.onopen = () => {
        statusEl.textContent = "Connected";
        statusEl.className = "status connected";
        inputEl.disabled = false;
        sendBtn.disabled = false;
        addMessage("agent", "Hello! Welcome to City Dental Clinic. How can I help you today?");
    };

    ws.onclose = () => {
        statusEl.textContent = "Disconnected";
        statusEl.className = "status disconnected";
        inputEl.disabled = true;
        sendBtn.disabled = true;
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        removeTyping();
        if (data.type === "typing") {
            addTyping();
        } else if (data.type === "message") {
            addMessage("agent", data.reply, data.intent);
            sendBtn.disabled = false;
            inputEl.disabled = false;
        }
    };

    function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;
        addMessage("user", text);
        ws.send(JSON.stringify({ message: text }));
        inputEl.value = "";
        sendBtn.disabled = true;
        inputEl.disabled = true;
    }

    function addMessage(role, text, intent = "") {
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.innerHTML = text;
        if (intent && role === "agent") {
            const tag = document.createElement("div");
            tag.className = "intent-tag";
            tag.textContent = intent;
            div.appendChild(tag);
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTyping() {
        const div = document.createElement("div");
        div.className = "typing";
        div.id = "typing";
        div.textContent = "Assistant is typing...";
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById("typing");
        if (el) el.remove();
    }

    inputEl.addEventListener("keydown", e => {
        if (e.key === "Enter") sendMessage();
    });
</script>
</body>
</html>
