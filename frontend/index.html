<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Dental -- AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 440px; background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #1F4E79; color: white; padding: 20px; text-align: center; }
        .header h2 { font-size: 18px; }
        .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
        .tabs { display: flex; border-bottom: 1px solid #e5e7eb; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 14px; color: #6b7280; border-bottom: 2px solid transparent; }
        .tab.active { color: #1F4E79; border-bottom-color: #1F4E79; font-weight: bold; }
        .panel { display: none; }
        .panel.active { display: flex; flex-direction: column; }
        .messages { height: 380px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .user { align-self: flex-end; background: #1F4E79; color: white; border-bottom-right-radius: 4px; }
        .agent { align-self: flex-start; background: #f0f4f8; color: #1a1a1a; border-bottom-left-radius: 4px; }
        .typing { align-self: flex-start; background: #f0f4f8; padding: 10px 14px; border-radius: 12px; font-size: 13px; color: #888; }
        .intent-tag { font-size: 10px; opacity: 0.6; margin-top: 4px; }
        .input-area { padding: 16px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; }
        input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #1F4E79; }
        button { padding: 10px 18px; background: #1F4E79; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button:hover { background: #2E75B6; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .status { text-align: center; font-size: 12px; color: #6b7280; padding: 6px; }
        .status.connected { color: #16a34a; }
        .status.disconnected { color: #dc2626; }

        /* Voice Panel */
        .voice-panel { padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; min-height: 460px; }
        .mic-btn { width: 90px; height: 90px; border-radius: 50%; border: none; cursor: pointer; font-size: 32px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .mic-btn.idle { background: #1F4E79; color: white; }
        .mic-btn.recording { background: #dc2626; color: white; animation: pulse 1s infinite; }
        .mic-btn.disabled { background: #9ca3af; cursor: not-allowed; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .voice-status { font-size: 14px; color: #6b7280; text-align: center; }
        .voice-transcript { background: #f0f4f8; border-radius: 8px; padding: 12px 16px; font-size: 14px; color: #1a1a1a; width: 100%; min-height: 48px; text-align: center; }
        .voice-reply { background: #e8f0fe; border-radius: 8px; padding: 12px 16px; font-size: 14px; color: #1a1a1a; width: 100%; min-height: 48px; text-align: center; }
        .voice-log { width: 100%; max-height: 140px; overflow-y: auto; font-size: 12px; color: #6b7280; }
        .voice-log-item { padding: 4px 0; border-bottom: 1px solid #f0f4f8; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>City Dental Clinic</h2>
        <p>AI Assistant -- Available 24/7</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('text')">💬 Text Chat</div>
        <div class="tab" onclick="switchTab('voice')">🎤 Voice Chat</div>
    </div>

    <!-- Text Panel -->
    <div id="text-panel" class="panel active">
        <div id="status-text" class="status disconnected">Connecting...</div>
        <div id="messages" class="messages"></div>
        <div class="input-area">
            <input id="input" type="text" placeholder="Ask me anything..." disabled />
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <!-- Voice Panel -->
    <div id="voice-panel" class="panel">
        <div class="voice-panel">
            <div id="status-voice" class="status disconnected">Connecting...</div>
            <button id="mic-btn" class="mic-btn disabled" onclick="toggleRecording()">🎤</button>
            <div class="voice-status" id="voice-status">Press mic to speak</div>
            <div class="voice-transcript" id="voice-transcript">Your speech will appear here...</div>
            <div class="voice-reply" id="voice-reply">Agent reply will appear here...</div>
            <div class="voice-log" id="voice-log"></div>
        </div>
    </div>
</div>

<script>
    const sessionId = crypto.randomUUID();
    // connect back to whichever host served this page (works for localhost, 127.0.0.1, a domain, https)
    const WS_BASE = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let voiceWs = null;
    let currentAudio = null;   // the agent reply that is playing, if any

    // ── Text WebSocket ──────────────────────────────────────────
    const textWs = new WebSocket(`${WS_BASE}/ws/${sessionId}`);
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");
    const statusTextEl = document.getElementById("status-text");

    textWs.onopen = () => {
        statusTextEl.textContent = "Connected";
        statusTextEl.className = "status connected";
        inputEl.disabled = false;
        sendBtn.disabled = false;
        addMessage("agent", "Hello! Welcome to City Dental Clinic. How can I help you today?");
    };
    textWs.onclose = () => {
        statusTextEl.textContent = "Disconnected";
        statusTextEl.className = "status disconnected";
    };
    textWs.onmessage = (event) => {
        const data = JSON.parse(event.data);
        removeTyping();
        if (data.type === "typing") addTyping();
        else if (data.type === "message" || data.type === "error") {
            addMessage("agent", data.type === "error" ? data.message : data.reply, data.intent);
            sendBtn.disabled = false;
            inputEl.disabled = false;
        }
    };

    function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;
        addMessage("user", text);
        textWs.send(JSON.stringify({ message: text }));
        inputEl.value = "";
        sendBtn.disabled = true;
        inputEl.disabled = true;
    }

    function addMessage(role, text, intent = "") {
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.textContent = text;
        if (intent && role === "agent") {
            const tag = document.createElement("div");
            tag.className = "intent-tag";
            tag.textContent = intent;
            div.appendChild(tag);
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTyping() {
        const div = document.createElement("div");
        div.className = "typing"; div.id = "typing";
        div.textContent = "Assistant is typing...";
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function removeTyping() {
        const el = document.getElementById("typing");
        if (el) el.remove();
    }

    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

    // ── Voice WebSocket ─────────────────────────────────────────
    function connectVoiceWs() {
        voiceWs = new WebSocket(`${WS_BASE}/ws/voice/${sessionId}`);
        const statusVoiceEl = document.getElementById("status-voice");
        const micBtn = document.getElementById("mic-btn");

        voiceWs.onopen = () => {
            statusVoiceEl.textContent = "Connected";
            statusVoiceEl.className = "status connected";
            micBtn.className = "mic-btn idle";
        };
        voiceWs.onclose = () => {
            statusVoiceEl.textContent = "Disconnected";
            statusVoiceEl.className = "status disconnected";
            micBtn.className = "mic-btn disabled";
        };
        voiceWs.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "status") {
                document.getElementById("voice-status").textContent = data.message;
                addVoiceLog(data.message);
            } else if (data.type === "transcript") {
                document.getElementById("voice-transcript").textContent = data.text;
                addVoiceLog("You: " + data.text);
            } else if (data.type === "reply") {
                // the spoken version follows; the mic re-enables when it arrives (or on error)
                document.getElementById("voice-reply").textContent = data.text;
                addVoiceLog("Agent: " + data.text);
            } else if (data.type === "audio") {
                playAudio(data.data);
            } else if (data.type === "error") {
                document.getElementById("voice-status").textContent = data.message;
                micBtn.className = "mic-btn idle";
            }
        };
    }

    async function toggleRecording() {
        const micBtn = document.getElementById("mic-btn");
        if (micBtn.classList.contains("disabled")) return;

        if (!isRecording) {
            // start recording -- barge-in: stop the agent so its voice isn't recorded
            stopSpeaking();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                const arrayBuffer = await blob.arrayBuffer();
                voiceWs.send(arrayBuffer);
                document.getElementById("voice-status").textContent = "Processing...";
                micBtn.className = "mic-btn disabled";
            };
            mediaRecorder.start();
            isRecording = true;
            micBtn.className = "mic-btn recording";
            micBtn.textContent = "⏹";
            document.getElementById("voice-status").textContent = "Recording... press to stop";
        } else {
            // stop recording
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(t => t.stop());
            isRecording = false;
            micBtn.textContent = "🎤";
        }
    }

    function playAudio(base64Data) {
        const binary = atob(base64Data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes], { type: "audio/mp3" });
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        currentAudio = audio;

        const finished = () => {
            URL.revokeObjectURL(url);
            if (currentAudio === audio) {   // not interrupted by a new recording
                currentAudio = null;
                document.getElementById("voice-status").textContent = "Press mic to speak";
            }
        };
        audio.onended = finished;

        document.getElementById("mic-btn").className = "mic-btn idle";
        document.getElementById("voice-status").textContent = "Speaking... (press mic to interrupt)";
        audio.play().catch(finished);       // e.g. autoplay blocked: don't stay on "Speaking"
    }

    function stopSpeaking() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
    }

    function addVoiceLog(text) {
        const log = document.getElementById("voice-log");
        const item = document.createElement("div");
        item.className = "voice-log-item";
        item.textContent = text;
        log.appendChild(item);
        log.scrollTop = log.scrollHeight;
    }

    // ── Tab Switching ───────────────────────────────────────────
    function switchTab(tab) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add("active");
        document.getElementById(`${tab}-panel`).classList.add("active");
        if (tab === "voice" && !voiceWs) connectVoiceWs();
    }
</script>
</body>
</html>
