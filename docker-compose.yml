services:
  voice-agent:
    build: .
    container_name: voice-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro     # knowledge base + business config (re-ingested on every start)
      - storage:/app/storage    # conversation memory + bookings, survives rebuilds
    restart: unless-stopped

volumes:
  storage:
