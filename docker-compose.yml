services:
  voice-agent:
    build: .
    container_name: voice-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - USE_ONNX_EMBEDDINGS=true
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./memory.db:/app/memory.db
      - ./bookings.db:/app/bookings.db
    restart: unless-stopped