[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import sorting, bugbear
select = ["F", "E", "I", "B"]
ignore = ["E501"]  # long prompt strings are fine

[tool.ruff.lint.isort]
known-first-party = ["app"]
