<!doctype html>
<!-- Intro card for the demo GIF, rendered with HyperFrames:  cd demo/intro && hyperframes render -o ../out/intro.mp4 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=600" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 960px; height: 600px; overflow: hidden; background: #0f2a44; }
      #root {
        width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: "Segoe UI", Arial, sans-serif; color: #fff;
        background: radial-gradient(circle at 50% 40%, #1f4e79 0%, #0f2a44 70%);
      }
      #card {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #badge {
        font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
        color: #9cc3e6; border: 1px solid #3f6f9c; border-radius: 999px; padding: 6px 16px;
      }
      #title { font-size: 64px; font-weight: 700; letter-spacing: -0.02em; margin-top: 22px; }
      #subtitle { font-size: 24px; color: #d5e5f5; margin-top: 14px; }
      #stack { font-size: 17px; color: #9cc3e6; margin-top: 34px; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="960" data-height="600">
      <!-- clips are positioned as layers, so the text lives in normal flow inside one clip -->
      <div id="card" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="badge">Live demo · real app</div>
        <h1 id="title">AI Voice Agent</h1>
        <p id="subtitle">Answers questions and books appointments, by text or voice</p>
        <p id="stack">LangGraph · FastAPI · Deepgram · ChromaDB · Edge TTS</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#badge", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1)
        .fromTo("#title", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.25)
        .fromTo("#subtitle", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6)
        .fromTo("#stack", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.95)
        .to("#root", { opacity: 0, duration: 0.35, ease: "power2.in" }, 2.65);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
